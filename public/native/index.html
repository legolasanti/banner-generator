<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native Premium · ABC design</title>
    <meta name="description" content="ABC design — Native Premium: annonsørinnhold med AI, uten Vev." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a6b1a'/%3E%3Crect x='7' y='8' width='18' height='5' rx='1.5' fill='white'/%3E%3Crect x='7' y='15' width='18' height='9' rx='1.5' fill='%23bfe3bf'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/native/app/native.css" />
  </head>
  <body class="nx-body">
    <header class="topbar">
      <a class="brand" href="/#/" title="ABC design">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <rect width="32" height="32" rx="9" fill="currentColor" />
            <rect x="7" y="8" width="18" height="5" rx="1.6" fill="#fff" />
            <rect x="7" y="15" width="18" height="9" rx="1.6" fill="#bfe3bf" />
          </svg>
        </span>
        <span class="brand__text"><strong>ABC</strong> design</span>
      </a>
      <nav class="areas" aria-label="Område">
        <a class="area" href="/#/">Annonser</a>
        <a class="area is-active" href="/native/#/" aria-current="page">Native Premium</a>
      </nav>
      <!-- Filled by app/main.js: section tabs, or the open project's toolbar. -->
      <div class="nx-topbar" id="nxTopbar"></div>
    </header>

    <main class="nx-main" id="nxMain" tabindex="-1"></main>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- Shared with the Wallpaper editor: DOM builder, icons, toasts, popovers. -->
    <script src="/wallpaper/editor/util.js"></script>
    <script src="/wallpaper/fonts.js"></script>
    <!-- The Native Premium model and renderer (the server uses the same files). -->
    <script src="/native/schema.js"></script>
    <script src="/native/doc.js"></script>
    <script src="/native/render.js"></script>
    <script src="/native/templates.js"></script>
    <!-- The app, in dependency order. -->
    <script src="/native/app/api.js"></script>
    <script src="/native/app/ui.js"></script>
    <script src="/native/app/store.js"></script>
    <script src="/native/app/fields.js"></script>
    <script src="/native/app/media.js"></script>
    <script src="/native/app/canvas.js"></script>
    <script src="/native/app/sections.js"></script>
    <script src="/native/app/props.js"></script>
    <script src="/native/app/theme.js"></script>
    <script src="/native/app/project-panel.js"></script>
    <script src="/native/app/preflight.js"></script>
    <script src="/native/app/review.js"></script>
    <script src="/native/app/publish.js"></script>
    <script src="/native/app/ai.js"></script>
    <script src="/native/app/editor.js"></script>
    <script src="/native/app/projects.js"></script>
    <script src="/native/app/brands.js"></script>
    <script src="/native/app/library.js"></script>
    <script src="/native/app/settings.js"></script>
    <script src="/native/app/main.js"></script>
    <script src="/shared/session.js"></script>
  </body>
</html>
