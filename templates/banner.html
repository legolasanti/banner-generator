<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <title>Banner</title>
    <link rel="stylesheet" href="../public/assets/banner.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="banner-root"></div>
    <script src="../public/assets/banner.js"></script>
    <script src="./_render.js"></script>
    <script>
      /* One template for every format. The server injects window.__DATA__
         before any script runs (Puppeteer evaluateOnNewDocument), so the banner
         type travels with the data instead of needing a file per format — the
         page size comes from setViewport either way, never from this markup. */
      __initBanner((window.__DATA__ && window.__DATA__.__type) || "readpeak");
    </script>
  </body>
</html>
